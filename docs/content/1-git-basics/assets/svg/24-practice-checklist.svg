  <rect x="188" y="86" width="22" height="22" rx="4" fill="none" stroke="#2a9d8f" stroke-width="2"/>
  <text x="224" y="102" fill="#e0e0e0" font-size="13">Complete the <tspan font-family="monospace" fill="#7ec8e3">git clone</tspan> workflow</text>

  <rect x="188" y="116" width="22" height="22" rx="4" fill="none" stroke="#2a9d8f" stroke-width="2"/>
