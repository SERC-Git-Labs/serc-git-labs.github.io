<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="sans-serif">

  <rect x="150" y="10" width="560" height="180" rx="12" fill="#1a1a2e" stroke="#2a9d8f" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" fill="#2a9d8f" font-size="15" font-weight="bold">Hands-On Activity Checklist</text>

