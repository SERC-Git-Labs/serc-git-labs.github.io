<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="sans-serif">

  <!-- Path 1: git init (top) -->
  <rect x="30" y="20" width="220" height="70" rx="10" fill="#1a2a1a" stroke="#2a9d8f" stroke-width="2"/>
  <text x="140" y="48" text-anchor="middle" fill="#2a9d8f" font-size="13" font-weight="bold">Path 1: git init</text>
  <text x="140" y="68" text-anchor="middle" fill="#a0aec0" font-size="11">Start from a local folder</text>
  <text x="140" y="84" text-anchor="middle" fill="#718096" font-size="10" font-family="monospace">$ git init</text>

  <!-- Path 2: git clone (bottom) -->
  <rect x="30" y="130" width="220" height="70" rx="10" fill="#1a1a2e" stroke="#7ec8e3" stroke-width="2"/>
  <text x="140" y="158" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="bold">Path 2: git clone</text>
  <text x="140" y="178" text-anchor="middle" fill="#a0aec0" font-size="11">Start from GitHub</text>
  <text x="140" y="194" text-anchor="middle" fill="#718096" font-size="10" font-family="monospace">$ git clone &lt;url&gt;</text>

  <!-- Lines from paths converging -->
  <line x1="250" y1="55" x2="387" y2="105" stroke="#2a9d8f" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="400,110 385,111 389,99" fill="#2a9d8f"/>
  <line x1="250" y1="165" x2="387" y2="115" stroke="#7ec8e3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="400,110 389,121 385,109" fill="#7ec8e3"/>

  <!-- Local Repo result box -->
  <rect x="400" y="72" width="240" height="76" rx="12" fill="#2d2a1a" stroke="#e76f51" stroke-width="2.5"/>
  <text x="520" y="102" text-anchor="middle" fill="#e76f51" font-size="14" font-weight="bold">Local Repository</text>
  <text x="520" y="122" text-anchor="middle" fill="#a0aec0" font-size="11">.git/ directory present</text>
  <text x="520" y="138" text-anchor="middle" fill="#718096" font-size="10">ready to track changes</text>

  <!-- Continue arrow out -->
  <line x1="640" y1="110" x2="720" y2="110" stroke="#e76f51" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="716,104 730,110 716,116" fill="#e76f51"/>
  <text x="775" y="103" text-anchor="middle" fill="#a0aec0" font-size="11">start</text>
  <text x="775" y="118" text-anchor="middle" fill="#a0aec0" font-size="11">working!</text>

</svg>
