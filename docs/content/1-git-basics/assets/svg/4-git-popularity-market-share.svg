<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Git popularity compared to other version control systems</title>
  <desc id="desc">Bar chart showing Stack Overflow 2022 version control usage: Git 93.87 percent, Subversion 5.18 percent, None 4.31 percent, and Mercurial 1.13 percent.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="gitBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="otherBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- <rect width="1100" height="360" fill="url(#bg)"/> -->
  <rect x="28" y="20" width="1044" height="320" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <text x="70" y="60" fill="#e2e8f0" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">VCS Popularity (Stack Overflow 2022)</text>

  <line x1="90" y1="280" x2="1020" y2="280" stroke="#64748b" stroke-width="2"/>
  <line x1="90" y1="95" x2="90" y2="280" stroke="#64748b" stroke-width="2"/>

  <text x="42" y="102" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial, sans-serif">100%</text>
  <text x="52" y="148" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial, sans-serif">75%</text>
  <text x="52" y="194" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial, sans-serif">50%</text>
  <text x="52" y="240" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial, sans-serif">25%</text>

  <line x1="90" y1="95" x2="1020" y2="95" stroke="#1e293b" stroke-width="1"/>
  <line x1="90" y1="141" x2="1020" y2="141" stroke="#1e293b" stroke-width="1"/>
  <line x1="90" y1="187" x2="1020" y2="187" stroke="#1e293b" stroke-width="1"/>
  <line x1="90" y1="233" x2="1020" y2="233" stroke="#1e293b" stroke-width="1"/>

  <rect x="150" y="104" width="120" height="176" rx="10" fill="url(#gitBar)"/>
  <text x="210" y="96" text-anchor="middle" fill="#fed7aa" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">93.87%</text>
  <text x="210" y="305" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Git</text>

  <rect x="330" y="270" width="120" height="10" rx="10" fill="url(#otherBar)"/>
  <text x="390" y="264" text-anchor="middle" fill="#bfdbfe" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">5.18%</text>
  <text x="390" y="305" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Subversion</text>

  <rect x="510" y="272" width="120" height="8" rx="10" fill="url(#otherBar)"/>
  <text x="570" y="266" text-anchor="middle" fill="#bfdbfe" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">4.31%</text>
  <text x="570" y="305" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">None</text>

  <rect x="690" y="278" width="120" height="2" rx="10" fill="url(#otherBar)"/>
  <text x="750" y="272" text-anchor="middle" fill="#bfdbfe" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">1.13%</text>
  <text x="750" y="305" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Mercurial</text>

  <text x="70" y="334" fill="#94a3b8" font-size="12" font-family="Segoe UI, Arial, sans-serif">Source: Stack Overflow Developer Survey 2022</text>
</svg>
