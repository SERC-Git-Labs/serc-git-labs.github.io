<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="860" height="180" font-family="sans-serif">

  <defs>
    <marker id="wf-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a9d8f"/>
    </marker>
    <marker id="or-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e76f51"/>
    </marker>
  </defs>

  <!-- Step 1: GitHub repo page -->
  <rect x="10" y="30" width="200" height="120" rx="10" fill="#0d1117" stroke="#7ec8e3" stroke-width="2"/>
  <text x="110" y="54" text-anchor="middle" fill="#7ec8e3" font-size="12" font-weight="bold">GitHub Repo</text>
  <rect x="28" y="62" width="164" height="76" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="110" y="82" text-anchor="middle" fill="#a0aec0" font-size="10">user/my-repo</text>
  <rect x="38" y="90" width="144" height="20" rx="4" fill="#238636"/>
  <text x="110" y="104" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Code ▾  Clone URL</text>
  <text x="110" y="128" text-anchor="middle" fill="#718096" font-size="9" font-family="monospace">github.com/user/my-repo</text>

  <line x1="214" y1="90" x2="268" y2="90" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#wf-arr)"/>
  <text x="241" y="80" text-anchor="middle" fill="#2a9d8f" font-size="10">clone</text>

  <!-- Step 2: Terminal (git clone) -->
  <rect x="272" y="30" width="220" height="120" rx="10" fill="#1e1e1e" stroke="#2a9d8f" stroke-width="2"/>
  <text x="382" y="54" text-anchor="middle" fill="#2a9d8f" font-size="12" font-weight="bold">Terminal</text>
  <text x="290" y="76" fill="#55dd55" font-size="10" font-family="monospace">$ git clone &lt;url&gt;</text>
  <text x="290" y="93" fill="#a0aec0" font-size="10" font-family="monospace">$ cd my-repo</text>
  <text x="290" y="110" fill="#a0aec0" font-size="10" font-family="monospace">$ echo "hi" &gt;&gt; file.txt</text>
  <text x="290" y="127" fill="#a0aec0" font-size="10" font-family="monospace">$ git add . &amp;&amp; git commit</text>
  <text x="290" y="144" fill="#a0aec0" font-size="10" font-family="monospace">$ git push</text>

  <line x1="496" y1="90" x2="550" y2="90" stroke="#e76f51" stroke-width="2.5" marker-end="url(#or-arr)"/>
  <text x="523" y="80" text-anchor="middle" fill="#e76f51" font-size="10">push</text>

  <!-- Step 3: GitHub updated -->
  <rect x="554" y="30" width="286" height="120" rx="10" fill="#0d1117" stroke="#e76f51" stroke-width="2"/>
  <text x="697" y="54" text-anchor="middle" fill="#e76f51" font-size="12" font-weight="bold">GitHub (updated)</text>
  <rect x="572" y="62" width="250" height="76" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="697" y="82" text-anchor="middle" fill="#a0aec0" font-size="10">user/my-repo</text>
  <text x="597" y="102" fill="#a0aec0" font-size="10" font-family="monospace">● New commit pushed ✓</text>
  <text x="597" y="118" fill="#718096" font-size="10" font-family="monospace">● Previous commits</text>
  <text x="697" y="140" text-anchor="middle" fill="#2a9d8f" font-size="10">repo is now up to date</text>

</svg>
