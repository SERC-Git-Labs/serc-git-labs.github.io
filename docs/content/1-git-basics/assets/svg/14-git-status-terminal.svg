<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="monospace, sans-serif">

  <!-- Terminal window -->
  <rect x="80" y="20" width="700" height="180" rx="10" fill="#1e1e1e" stroke="#555" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="80" y="20" width="700" height="32" rx="10" fill="#3c3c3c"/>
  <rect x="80" y="36" width="700" height="16" fill="#3c3c3c"/>
  <!-- Traffic light dots -->
  <circle cx="106" cy="36" r="7" fill="#ff5f56"/>
  <circle cx="126" cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="146" cy="36" r="7" fill="#27c93f"/>
  <text x="430" y="41" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="sans-serif">bash — my-project</text>

  <!-- Terminal content -->
  <text x="108" y="76" fill="#55dd55" font-size="13">$ git status</text>
  <text x="108" y="98" fill="#aaaaaa" font-size="12">On branch main</text>
  <text x="108" y="115" fill="#aaaaaa" font-size="12">Changes not staged for commit:</text>
  <text x="108" y="132" fill="#aaaaaa" font-size="12">  (use "git add &lt;file&gt;..." to update what will be committed)</text>
  <text x="108" y="152" fill="#e76f51" font-size="12">        modified:   index.html</text>
  <text x="108" y="172" fill="#aaaaaa" font-size="12">Untracked files:</text>
  <text x="108" y="190" fill="#e76f51" font-size="12">        style.css</text>

</svg>
