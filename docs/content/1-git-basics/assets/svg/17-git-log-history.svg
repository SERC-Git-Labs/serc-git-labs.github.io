<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="monospace, sans-serif">

  <!-- Terminal window -->
  <rect x="60" y="16" width="740" height="194" rx="10" fill="#1e1e1e" stroke="#555" stroke-width="2"/>
  <rect x="60" y="16" width="740" height="32" rx="10" fill="#3c3c3c"/>
  <rect x="60" y="32" width="740" height="16" fill="#3c3c3c"/>
  <circle cx="86" cy="32" r="7" fill="#ff5f56"/>
  <circle cx="106" cy="32" r="7" fill="#ffbd2e"/>
  <circle cx="126" cy="32" r="7" fill="#27c93f"/>
  <text x="430" y="37" text-anchor="middle" fill="#aaaaaa" font-size="12" font-family="sans-serif">bash — my-project</text>

  <!-- git log output -->
  <text x="88" y="70" fill="#55dd55" font-size="13">$ git log --oneline</text>

  <text x="88" y="95" fill="#e76f51" font-size="12">jkl3456</text>
  <text x="160" y="95" fill="#e0e0e0" font-size="12"> (HEAD → main) Add styles</text>

  <text x="88" y="116" fill="#7ec8e3" font-size="12">ghi9012</text>
  <text x="160" y="116" fill="#e0e0e0" font-size="12"> Fix typo in readme</text>

  <text x="88" y="137" fill="#7ec8e3" font-size="12">def5678</text>
  <text x="160" y="137" fill="#e0e0e0" font-size="12"> Add homepage</text>

  <text x="88" y="158" fill="#7ec8e3" font-size="12">abc1234</text>
  <text x="160" y="158" fill="#e0e0e0" font-size="12"> Initial commit</text>

  <text x="88" y="184" fill="#55dd55" font-size="13">$ </text>
  <text x="103" y="184" fill="#55dd55" font-size="13">▊</text>

</svg>
