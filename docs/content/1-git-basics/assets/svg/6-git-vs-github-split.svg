<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="sans-serif">

  <!-- Left panel: Git (laptop) -->
  <rect x="10" y="10" width="390" height="200" rx="10" fill="#1a1a2e" stroke="#f05133" stroke-width="2"/>
  <text x="205" y="35" text-anchor="middle" fill="#f05133" font-size="14" font-weight="bold">Git</text>
  <text x="205" y="52" text-anchor="middle" fill="#aaaaaa" font-size="11">tool installed on your computer</text>

  <!-- Laptop body -->
  <rect x="110" y="65" width="190" height="115" rx="8" fill="#2d2d2d" stroke="#555" stroke-width="2"/>
  <!-- Screen bezel -->
  <rect x="118" y="72" width="174" height="95" rx="4" fill="#0d0d0d"/>
  <!-- Screen content: terminal -->
  <text x="128" y="92" fill="#2a9d8f" font-size="10" font-family="monospace">$ git init</text>
  <text x="128" y="107" fill="#2a9d8f" font-size="10" font-family="monospace">$ git add .</text>
  <text x="128" y="122" fill="#2a9d8f" font-size="10" font-family="monospace">$ git commit -m "fix"</text>
  <text x="128" y="137" fill="#2a9d8f" font-size="10" font-family="monospace">$ git push</text>
  <text x="128" y="152" fill="#55dd55" font-size="10" font-family="monospace">▊</text>
  <!-- Laptop base -->
  <rect x="90" y="180" width="230" height="12" rx="4" fill="#444" stroke="#555" stroke-width="1"/>
  <!-- Trackpad -->
  <rect x="175" y="183" width="60" height="6" rx="3" fill="#555"/>

  <!-- Right panel: GitHub (cloud) -->
  <rect x="460" y="10" width="390" height="200" rx="10" fill="#0d1117" stroke="#7ec8e3" stroke-width="2"/>
  <text x="655" y="35" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">GitHub</text>
  <text x="655" y="52" text-anchor="middle" fill="#aaaaaa" font-size="11">website for hosting &amp; sharing repos</text>

  <!-- Cloud shape -->
  <ellipse cx="610" cy="115" rx="40" ry="28" fill="#21262d" stroke="#7ec8e3" stroke-width="2"/>
  <ellipse cx="645" cy="105" rx="35" ry="25" fill="#21262d" stroke="#7ec8e3" stroke-width="2"/>
  <ellipse cx="685" cy="112" rx="38" ry="26" fill="#21262d" stroke="#7ec8e3" stroke-width="2"/>
  <rect x="576" y="118" width="147" height="30" fill="#21262d"/>
  <!-- Cloud bottom line -->
  <line x1="576" y1="148" x2="723" y2="148" stroke="#7ec8e3" stroke-width="2"/>
  <!-- GitHub Octocat-ish icon inside cloud -->
  <circle cx="650" cy="118" r="18" fill="#30363d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="650" y="124" text-anchor="middle" fill="#7ec8e3" font-size="18">⬡</text>
  <!-- Repo label -->
  <text x="655" y="170" text-anchor="middle" fill="#7ec8e3" font-size="11" font-family="monospace">github.com/user/repo</text>
  <text x="655" y="187" text-anchor="middle" fill="#888" font-size="10">backup · collaboration · sharing</text>

  <!-- VS divider -->
  <text x="430" y="118" text-anchor="middle" fill="#888888" font-size="20" font-weight="bold">vs</text>

</svg>
