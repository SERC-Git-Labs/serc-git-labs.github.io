<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="sans-serif">

  <!-- Before: Empty folder -->
  <rect x="60" y="30" width="300" height="140" rx="10" fill="#2d3748" stroke="#718096" stroke-width="2"/>
  <rect x="60" y="18" width="100" height="22" rx="6" fill="#2d3748" stroke="#718096" stroke-width="2"/>
  <text x="110" y="33" text-anchor="middle" fill="#a0aec0" font-size="11">my-project/</text>
  <text x="210" y="58" text-anchor="middle" fill="#718096" font-size="13">Before</text>
  <!-- Empty state -->
  <text x="210" y="105" text-anchor="middle" fill="#4a5568" font-size="40">📁</text>
  <text x="210" y="145" text-anchor="middle" fill="#4a5568" font-size="11">empty folder</text>
  <text x="210" y="160" text-anchor="middle" fill="#4a5568" font-size="10" font-family="monospace">no Git tracking</text>

  <!-- Arrow + command -->
  <line x1="372" y1="100" x2="488" y2="100" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/>
  <polygon points="484,93 498,100 484,107" fill="#2a9d8f"/>
  <text x="430" y="88" text-anchor="middle" fill="#2a9d8f" font-size="12" font-weight="bold" font-family="monospace">$ git init</text>

  <!-- After: Git-tracked folder -->
  <rect x="500" y="30" width="300" height="140" rx="10" fill="#1a2a1a" stroke="#2a9d8f" stroke-width="2.5"/>
  <rect x="500" y="18" width="100" height="22" rx="6" fill="#1a2a1a" stroke="#2a9d8f" stroke-width="2"/>
  <text x="550" y="33" text-anchor="middle" fill="#2a9d8f" font-size="11">my-project/</text>
  <text x="650" y="58" text-anchor="middle" fill="#2a9d8f" font-size="13">After</text>
  <!-- Files + .git -->
  <text x="540" y="88" fill="#a0aec0" font-size="12">📁 .git/</text>
  <text x="540" y="110" fill="#718096" font-size="10" font-family="monospace">   config  HEAD</text>
  <text x="540" y="126" fill="#718096" font-size="10" font-family="monospace">   objects/  refs/</text>
  <text x="540" y="148" fill="#2a9d8f" font-size="11" font-style="italic">Git is now tracking this folder</text>
  <text x="540" y="163" fill="#718096" font-size="10" font-family="monospace">Initialized empty Git repository</text>

</svg>
