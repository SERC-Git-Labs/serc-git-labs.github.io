<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="sans-serif">

  <!-- GitHub Cloud (left) -->
  <rect x="30" y="20" width="300" height="160" rx="10" fill="#0d1117" stroke="#7ec8e3" stroke-width="2"/>
  <text x="180" y="48" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">GitHub</text>
  <!-- Cloud shape -->
  <ellipse cx="150" cy="105" rx="38" ry="26" fill="#21262d" stroke="#7ec8e3" stroke-width="1.5"/>
  <ellipse cx="185" cy="95" rx="33" ry="23" fill="#21262d" stroke="#7ec8e3" stroke-width="1.5"/>
  <ellipse cx="220" cy="103" rx="36" ry="24" fill="#21262d" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="116" y="108" width="140" height="28" fill="#21262d"/>
  <line x1="116" y1="136" x2="256" y2="136" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="185" y="125" text-anchor="middle" fill="#7ec8e3" font-size="10" font-family="monospace">user/my-repo</text>
  <text x="180" y="158" text-anchor="middle" fill="#718096" font-size="10">files + full history</text>

  <!-- Arrow down-right with command -->
  <line x1="340" y1="100" x2="490" y2="100" stroke="#2a9d8f" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="486,93 500,100 486,107" fill="#2a9d8f"/>
  <text x="415" y="86" text-anchor="middle" fill="#2a9d8f" font-size="12" font-weight="bold" font-family="monospace">$ git clone</text>
  <text x="415" y="120" text-anchor="middle" fill="#718096" font-size="10">copies files + history</text>

  <!-- Local laptop (right) -->
  <rect x="510" y="20" width="320" height="160" rx="10" fill="#1a1a2e" stroke="#2a9d8f" stroke-width="2"/>
  <text x="670" y="48" text-anchor="middle" fill="#2a9d8f" font-size="14" font-weight="bold">Your Computer</text>
  <!-- Laptop body -->
  <rect x="590" y="60" width="160" height="90" rx="6" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="597" y="67" width="146" height="72" rx="3" fill="#0d1117"/>
  <text x="670" y="93" text-anchor="middle" fill="#2a9d8f" font-size="10" font-family="monospace">my-repo/</text>
  <text x="670" y="108" text-anchor="middle" fill="#718096" font-size="9" font-family="monospace">📁 .git/</text>
  <text x="670" y="123" text-anchor="middle" fill="#a0aec0" font-size="9" font-family="monospace">📄 README.md</text>
  <text x="670" y="138" text-anchor="middle" fill="#a0aec0" font-size="9" font-family="monospace">origin = GitHub ✓</text>
  <rect x="570" y="150" width="200" height="10" rx="4" fill="#4a5568"/>

</svg>
