<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="sans-serif">

  <!-- Local repo (laptop) -->
  <rect x="40" y="30" width="300" height="140" rx="10" fill="#1a1a2e" stroke="#2a9d8f" stroke-width="2"/>
  <text x="190" y="55" text-anchor="middle" fill="#2a9d8f" font-size="14" font-weight="bold">Local Repo</text>
  <text x="190" y="75" text-anchor="middle" fill="#a0aec0" font-size="11">on your computer</text>
  <!-- Laptop icon -->
  <rect x="115" y="88" width="150" height="52" rx="5" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="122" y="94" width="136" height="38" rx="3" fill="#0d1117"/>
  <text x="190" y="118" text-anchor="middle" fill="#2a9d8f" font-size="10" font-family="monospace">$ git commit</text>
  <rect x="100" y="140" width="180" height="8" rx="4" fill="#4a5568"/>

  <!-- Separate arrows -->
  <!-- Push: local to remote -->
  <line x1="360" y1="92" x2="500" y2="92" stroke="#e76f51" stroke-width="3"/>
  <polygon points="496,85 510,92 496,99" fill="#e76f51"/>
  <text x="430" y="82" text-anchor="middle" fill="#e76f51" font-size="11" font-weight="bold">git push</text>

  <!-- Pull: remote to local -->
  <line x1="500" y1="112" x2="360" y2="112" stroke="#7ec8e3" stroke-width="3"/>
  <polygon points="364,105 350,112 364,119" fill="#7ec8e3"/>
  <text x="430" y="126" text-anchor="middle" fill="#7ec8e3" font-size="11" font-weight="bold">git pull</text>

  <!-- GitHub (cloud) -->
  <rect x="520" y="30" width="300" height="140" rx="10" fill="#0b1220" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="670" y="55" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">Remote Repo (origin)</text>
  <text x="670" y="75" text-anchor="middle" fill="#a0aec0" font-size="11">hosted in the cloud</text>

  <!-- Cloud + network cues -->
  <ellipse cx="640" cy="118" rx="30" ry="20" fill="#1f2937" stroke="#7ec8e3" stroke-width="1.5"/>
  <ellipse cx="668" cy="110" rx="28" ry="19" fill="#1f2937" stroke="#7ec8e3" stroke-width="1.5"/>
  <ellipse cx="698" cy="116" rx="30" ry="20" fill="#1f2937" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="614" y="122" width="114" height="22" fill="#1f2937"/>
  <line x1="614" y1="144" x2="728" y2="144" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="626" y="136" text-anchor="start" fill="#7ec8e3" font-size="10" font-family="monospace">github.com/org/repo.git</text>

  <!-- Server icon inside cloud -->
  <rect x="572" y="98" width="48" height="44" rx="5" fill="#111827" stroke="#7ec8e3" stroke-width="1.2"/>
  <rect x="577" y="103" width="38" height="8" rx="2" fill="#1f2937" stroke="#4a5568" stroke-width="0.8"/>
  <rect x="577" y="114" width="38" height="8" rx="2" fill="#1f2937" stroke="#4a5568" stroke-width="0.8"/>
  <rect x="577" y="125" width="38" height="8" rx="2" fill="#1f2937" stroke="#4a5568" stroke-width="0.8"/>
  <circle cx="581" cy="107" r="1.2" fill="#2a9d8f"/>
  <circle cx="581" cy="118" r="1.2" fill="#e76f51"/>
  <circle cx="581" cy="129" r="1.2" fill="#7ec8e3"/>

</svg>
