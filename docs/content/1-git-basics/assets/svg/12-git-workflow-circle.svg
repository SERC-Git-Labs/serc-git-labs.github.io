<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="sans-serif">

  <!-- Center circle reference -->
  <!-- Steps arranged in a pentagon around center (430, 130) -->

  <!-- Step boxes and curved arrows -->
  <!-- Positions:
    1 Edit files:     (430, 30)   top center
    2 Check status:  (680, 110)  right
    3 Stage changes: (600, 220)  bottom right
    4 Commit:        (260, 220)  bottom left
    5 Push:          (180, 110)  left
  -->

  <!-- Connecting arcs (drawn as lines for simplicity) -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a9d8f"/>
    </marker>
  </defs>

  <!-- Arrow lines between steps -->
  <line x1="510" y1="55" x2="648" y2="105" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="148" x2="635" y2="205" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="232" x2="322" y2="232" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="225" y1="208" x2="194" y2="150" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="215" y1="107" x2="355" y2="55" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: Edit files (top) -->
  <rect x="345" y="15" width="170" height="50" rx="10" fill="#2d3748" stroke="#e76f51" stroke-width="2"/>
  <text x="430" y="37" text-anchor="middle" fill="#e76f51" font-size="13" font-weight="bold">1. Edit Files</text>
  <text x="430" y="54" text-anchor="middle" fill="#a0aec0" font-size="10">make your changes</text>

  <!-- Step 2: git status (right) -->
  <rect x="615" y="92" width="160" height="50" rx="10" fill="#2d3748" stroke="#2a9d8f" stroke-width="2"/>
  <text x="695" y="113" text-anchor="middle" fill="#2a9d8f" font-size="13" font-weight="bold">2. git status</text>
  <text x="695" y="130" text-anchor="middle" fill="#a0aec0" font-size="10">check what changed</text>

  <!-- Step 3: git add (bottom right) -->
  <rect x="530" y="208" width="145" height="50" rx="10" fill="#2d3748" stroke="#2a9d8f" stroke-width="2"/>
  <text x="602" y="229" text-anchor="middle" fill="#2a9d8f" font-size="13" font-weight="bold">3. git add</text>
  <text x="602" y="246" text-anchor="middle" fill="#a0aec0" font-size="10">stage changes</text>

  <!-- Step 4: git commit (bottom left) -->
  <rect x="190" y="208" width="155" height="50" rx="10" fill="#2d3748" stroke="#2a9d8f" stroke-width="2"/>
  <text x="267" y="229" text-anchor="middle" fill="#2a9d8f" font-size="13" font-weight="bold">4. git commit</text>
  <text x="267" y="246" text-anchor="middle" fill="#a0aec0" font-size="10">save snapshot</text>

  <!-- Step 5: git push (left) -->
  <rect x="85" y="92" width="145" height="50" rx="10" fill="#2d3748" stroke="#e76f51" stroke-width="2"/>
  <text x="157" y="113" text-anchor="middle" fill="#e76f51" font-size="13" font-weight="bold">5. git push</text>
  <text x="157" y="130" text-anchor="middle" fill="#a0aec0" font-size="10">send to GitHub</text>

</svg>
