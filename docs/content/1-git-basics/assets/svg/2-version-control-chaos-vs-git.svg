<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" font-family="monospace, sans-serif">

  <!-- Left panel: chaos -->
  <rect x="10" y="10" width="390" height="200" rx="10" fill="#3a1a1a" stroke="#e76f51" stroke-width="2"/>
  <text x="205" y="35" text-anchor="middle" fill="#e76f51" font-size="13" font-weight="bold" font-family="sans-serif">❌ Without Git</text>

  <!-- Scattered file labels -->
  <rect x="25" y="45" width="230" height="22" rx="4" fill="#5c2d2d"/>
  <text x="35" y="61" fill="#f4a261" font-size="11">📄 report.docx</text>

  <rect x="60" y="75" width="280" height="22" rx="4" fill="#5c2d2d"/>
  <text x="70" y="91" fill="#f4a261" font-size="11">📄 report_final.docx</text>

  <rect x="30" y="105" width="320" height="22" rx="4" fill="#5c2d2d"/>
  <text x="40" y="121" fill="#f4a261" font-size="11">📄 report_final_v2.docx</text>

  <rect x="55" y="135" width="320" height="22" rx="4" fill="#5c2d2d"/>
  <text x="65" y="151" fill="#f4a261" font-size="11">📄 report_final_v2_REAL.docx</text>

  <rect x="20" y="165" width="355" height="22" rx="4" fill="#5c2d2d"/>
  <text x="30" y="181" fill="#f4a261" font-size="11">📄 report_FINAL_useThisOne_v3.docx</text>

  <!-- Right panel: clean Git history -->
  <rect x="460" y="10" width="390" height="200" rx="10" fill="#0d2b1a" stroke="#2a9d8f" stroke-width="2"/>
  <text x="655" y="35" text-anchor="middle" fill="#2a9d8f" font-size="13" font-weight="bold" font-family="sans-serif">✅ With Git</text>

  <!-- Commit timeline vertical line -->
  <line x1="510" y1="50" x2="510" y2="195" stroke="#2a9d8f" stroke-width="3" stroke-linecap="round"/>

  <!-- Commits -->
  <circle cx="510" cy="60" r="8" fill="#2a9d8f"/>
  <text x="528" y="64" fill="#a8d8c8" font-size="11">abc1234  Add initial report</text>

  <circle cx="510" cy="95" r="8" fill="#2a9d8f"/>
  <text x="528" y="99" fill="#a8d8c8" font-size="11">def5678  Fix introduction</text>

  <circle cx="510" cy="130" r="8" fill="#2a9d8f"/>
  <text x="528" y="134" fill="#a8d8c8" font-size="11">ghi9012  Add conclusions</text>

  <circle cx="510" cy="165" r="8" fill="#e76f51"/>
  <text x="528" y="169" fill="#a8d8c8" font-size="11">jkl3456  Final revisions  ← HEAD</text>

  <!-- VS divider -->
  <text x="430" y="115" text-anchor="middle" fill="#888888" font-size="20" font-weight="bold" font-family="sans-serif">vs</text>

</svg>
