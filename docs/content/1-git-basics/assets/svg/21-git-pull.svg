<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190" font-family="sans-serif">

  <!-- GitHub Cloud (left) -->
  <rect x="40" y="20" width="312" height="150" rx="10" fill="#0d1117" stroke="#7ec8e3" stroke-width="2"/>
  <text x="196" y="46" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">GitHub (origin)</text>
  <!-- Cloud -->
  <ellipse cx="156" cy="108" rx="34" ry="22" fill="#21262d" stroke="#7ec8e3" stroke-width="1.5"/>
  <ellipse cx="190" cy="98" rx="30" ry="21" fill="#21262d" stroke="#7ec8e3" stroke-width="1.5"/>
  <ellipse cx="228" cy="106" rx="34" ry="22" fill="#21262d" stroke="#7ec8e3" stroke-width="1.5"/>
  <rect x="126" y="112" width="136" height="24" fill="#21262d"/>
  <line x1="126" y1="136" x2="262" y2="136" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="196" y="126" text-anchor="middle" fill="#7ec8e3" font-size="10" font-family="monospace">new commits available</text>
  <text x="196" y="162" text-anchor="middle" fill="#718096" font-size="10" font-family="monospace">github.com/user/repo</text>

  <!-- Arrow: GitHub → laptop -->
  <defs>
    <marker id="pull-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7ec8e3"/>
    </marker>
  </defs>
  <line x1="360" y1="95" x2="532" y2="95" stroke="#7ec8e3" stroke-width="4" stroke-linecap="round" marker-end="url(#pull-arr)"/>
  <text x="446" y="80" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="bold">git pull</text>
  <text x="446" y="116" text-anchor="middle" fill="#718096" font-size="10">downloads remote</text>
  <text x="446" y="130" text-anchor="middle" fill="#718096" font-size="10">commits to local</text>

  <!-- Laptop (local, right) -->
  <rect x="540" y="20" width="280" height="150" rx="10" fill="#1a1a2e" stroke="#2a9d8f" stroke-width="2"/>
  <text x="680" y="46" text-anchor="middle" fill="#2a9d8f" font-size="14" font-weight="bold">Local Repo</text>
  <rect x="580" y="58" width="200" height="80" rx="6" fill="#2d3748" stroke="#4a5568" stroke-width="1.5"/>
  <rect x="587" y="65" width="186" height="64" rx="3" fill="#0d1117"/>
  <text x="680" y="89" text-anchor="middle" fill="#7ec8e3" font-size="11" font-family="monospace">● xyz9999 New feature</text>
  <text x="680" y="106" text-anchor="middle" fill="#2a9d8f" font-size="11" font-family="monospace">● jkl3456 Add styles</text>
  <text x="680" y="123" text-anchor="middle" fill="#718096" font-size="11" font-family="monospace">● abc1234 Initial</text>
  <rect x="565" y="138" width="230" height="10" rx="4" fill="#4a5568"/>
  <text x="680" y="165" text-anchor="middle" fill="#7ec8e3" font-size="10">now up to date ✓</text>

</svg>
